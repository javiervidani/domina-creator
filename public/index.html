<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>domina-creator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&family=Rubik:wght@500;600&display=swap">
<style>
  :root{--ground:#f3f6fc;--ink:#1f1f1f;--ink-3:#676c72;--blue:#0b57d0;--blue-soft:#d3e3fd;--blue-ink:#041e49;--line:#dde3ea}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--ground);color:var(--ink);font:400 15px/1.5 'Heebo',system-ui,sans-serif}
  main{width:min(460px,100%);background:#fff;border-radius:24px;padding:40px 36px}
  h1{margin:0 0 6px;font:600 26px/1.2 'Rubik',sans-serif}
  h1 b{color:var(--blue)}
  p{margin:0 0 20px;color:var(--ink-3)}
  .pill{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--blue-soft);color:var(--blue-ink);font-size:13px;font-weight:500}
  ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
  li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:14px}
  li span:last-child{color:var(--ink-3)}
</style>
</head>
<body>
<main>
  <h1>domina<b>-creator</b></h1>
  <p>A private workspace for creators and mentors. Collect your content, edit it in one place, and send it back out.</p>
  <span class="pill">Under construction</span>
  <ul style="margin-top:24px">
    <li><span>Library</span><span>Planned</span></li>
    <li><span>Content editor</span><span>Planned</span></li>
    <li><span>Connected accounts</span><span>Planned</span></li>
  </ul>
</main>
</body>
</html>
